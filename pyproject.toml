[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-gaviao-real"
version = "0.1.0"
description = "Hybrid document extraction MCP server with adaptive hardware routing, page-granular SQLite FTS5 cache, and eagle-eye visual zoom."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Lucas Matheus Moreira Pastor", email = "54546478+LucasEBRTIA@users.noreply.github.com" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "pdf",
    "docling",
    "pymupdf",
    "markitdown",
    "ocr",
    "markdown",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.6.0",
    "pymupdf>=1.25.0",
    "pymupdf4llm>=0.0.17",
    "markitdown[docx,pptx,xlsx]>=0.1.0",
    "pillow>=10.4.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "platformdirs>=4.2.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
accurate = [
    "docling>=2.0.0",
    "rapidocr-onnxruntime>=1.4.0",
]
cpu = [
    "torch>=2.3.0",
]
cuda = [
    "torch>=2.3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "python-docx>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/LucasEBRTIA/mcp-gaviao-real"
Repository = "https://github.com/LucasEBRTIA/mcp-gaviao-real"
Issues = "https://github.com/LucasEBRTIA/mcp-gaviao-real/issues"

[project.scripts]
mcp-gaviao-real = "mcp_gaviao_real.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gaviao_real"]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cuda" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cuda" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
